# KAIVIRO — règles yamllint (mission A, 2026-11-05).
extends: default
rules:
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
ignore: |
  node_modules/
  apps/command-center/vendor/

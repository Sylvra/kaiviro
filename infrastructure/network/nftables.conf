#!/usr/sbin/nft -f
# KAIVIRO — pare-feu proposé pour la Raspberry Pi d'administration (mission A, 2026-11-05, v0.2).
# À relire et appliquer par Johan uniquement. Vérifier d'abord : sudo nft -c -f /etc/nftables.conf
#
# AVANT D'APPLIQUER (risque de se retrouver bloqué hors de la Pi) :
#   1. Remplacer LAN_ADMIN = { 192.0.2.10 } par l'IP RÉELLE du poste admin sur le LAN.
#      192.0.2.10 est une adresse d'exemple (TEST-NET-1, RFC 5737) : elle ne correspond à aucun poste.
#   2. Adapter WAN_IF et VPN_IF aux interfaces réelles (ip -br link).
#   3. Appliquer depuis la console locale, ou avec le filet de sécurité de infrastructure/network/README.md.
#
# Ce fichier ne gère QUE la table inet kaiviro_filter. Il ne vide pas tout le jeu de règles :
# les tables créées par Docker (iptables-nft ou backend nftables) sont conservées.
# Rappel nftables : un drop dans n'importe quelle chaîne de base d'un hook est définitif.
# D'où les règles forward explicites pour les bridges Docker ci-dessous.

define WAN_IF      = "eth0"
define VPN_IF      = "wg0"
define WG_PORT     = 51820
# À REMPLACER par l'IP réelle du poste admin sur le LAN (installation seulement, à retirer une fois le VPN validé).
define LAN_ADMIN   = { 192.0.2.10 }
# Réseaux Docker de infrastructure/monitoring/compose.yaml (NETWORK_AND_VPN §2) + bridge par défaut docker0.
define DOCKER_NETS = { 172.30.10.0/24, 172.30.20.0/24, 172.17.0.0/16 }

# Suppression puis recréation idempotente de la seule table KAIVIRO :
# la première ligne crée la table si elle n'existe pas, la deuxième la supprime, puis on la recrée.
table inet kaiviro_filter
delete table inet kaiviro_filter

table inet kaiviro_filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iif "lo" accept

    # ICMP utile au diagnostic réseau
    meta l4proto { icmp, ipv6-icmp } limit rate 10/second accept

    # WireGuard (seulement si WireGuard est retenu)
    iifname $WAN_IF udp dport $WG_PORT accept

    # SSH : VPN, et LAN admin le temps de l'installation
    iifname $VPN_IF tcp dport 22 accept
    ip saddr $LAN_ADMIN tcp dport 22 accept

    # Services de supervision : VPN uniquement
    iifname $VPN_IF tcp dport { 3000, 3001, 8080, 9090 } accept

    log prefix "kaiviro-drop-in " level info limit rate 5/minute
  }

  chain forward {
    type filter hook forward priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop

    # Interdit : VPN vers le LAN domestique ou Internet via la Pi (pas de routage du tunnel).
    iifname $VPN_IF ip daddr != $DOCKER_NETS drop

    # VPN vers les conteneurs : ports publiés par Docker (DNAT vers les IP des conteneurs).
    # Les ports sont liés à ${BIND_ADDR}, donc seul le trafic arrivant par le VPN les atteint.
    iifname $VPN_IF ip daddr $DOCKER_NETS accept

    # Conteneurs : trafic entre conteneurs et connexions sortantes (sondes Uptime Kuma, ntfy).
    # kv_monitoring est "internal: true" : Docker n'y crée aucune route sortante.
    ip saddr $DOCKER_NETS accept

    log prefix "kaiviro-drop-fwd " level info limit rate 5/minute
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}

#!/usr/sbin/nft -f
# KAIVIRO — pare-feu proposé pour la Raspberry Pi d'administration (mission A, 2026-11-05).
# À relire et appliquer par Johan uniquement. Vérifier d'abord : sudo nft -c -f /etc/nftables.conf
# Adapter LAN_ADMIN et les interfaces. Docker gère ses propres chaînes : d'où la liaison des ports à l'IP VPN.

flush ruleset

define WAN_IF    = "eth0"
define VPN_IF    = "wg0"
define WG_PORT   = 51820
# Poste admin sur le LAN, pour l'installation seulement. À retirer une fois le VPN validé.
define LAN_ADMIN = { 192.0.2.10 }

table inet kaiviro_filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iif "lo" accept

    # ICMP utile au diagnostic réseau
    meta l4proto { icmp, ipv6-icmp } limit rate 10/second accept

    # WireGuard (seulement si WireGuard est retenu)
    iifname $WAN_IF udp dport $WG_PORT accept

    # SSH : VPN, et LAN admin le temps de l'installation
    iifname $VPN_IF tcp dport 22 accept
    ip saddr $LAN_ADMIN tcp dport 22 accept

    # Services de supervision : VPN uniquement
    iifname $VPN_IF tcp dport { 3000, 3001, 8080, 9090 } accept

    log prefix "kaiviro-drop " level info limit rate 5/minute
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state established,related accept
    # Docker ajoute ses propres règles ; aucune redirection du VPN vers le LAN.
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}

# KAIVIRO — durcissement SSH proposé (mission A, 2026-11-05).
# À relire et appliquer par Johan uniquement.
# Destination : /etc/ssh/sshd_config.d/10-kaiviro-hardening.conf
# Avant rechargement : sudo sshd -t  (garder une session ouverte pendant le test)

# Authentification par clé uniquement
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# Pas de root, accès réservé au groupe des admins nominatifs
PermitRootLogin no
AllowGroups kaiviro-admins

# Limiter les tentatives et les sessions oisives
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# Pas de fonctions inutiles
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no

# Journalisation
LogLevel VERBOSE

# Écoute : à restreindre à l'IP VPN une fois le tunnel validé.
# ListenAddress 10.77.0.1

# KAIVIRO — configuration Prometheus proposée (mission A, 2026-11-05).
# Seuils et règles d'alerte : non définis ici, à fixer après observation réelle (CC-M2).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    site: kaiviro-admin-pi

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Backend applicatif (mission B) — à activer quand /metrics existe (OBSERVABILITY_CONTRACT §3).
  # Authentification à définir avec B : jeton lu depuis un fichier local, jamais en clair ici.
  # - job_name: kaiviro-backend

# KAIVIRO — Dependabot (mission A, 2026-11-05).
# Propose des PR de mise à jour ; aucune fusion automatique.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "mission:a"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: pip
    directory: /tests/contracts/admin
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies", "mission:a"]
    commit-message:
      prefix: "chore(deps)"

  # Images Docker de infrastructure/monitoring/compose.yaml : revue manuelle mensuelle
  # (voir docs/operations/CONTAINERS.md §5). Support Compose par Dependabot à vérifier avant activation.

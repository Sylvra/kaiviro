# Contrat de l'API d'administration KAIVIRO.
# Propriétaire : mission-a (spécification). Implémentation : module admin du backend (mission B) ; prototype CC-M1 dans apps/command-center.
# Statut : DRAFT 0.2 — 2026-11-09. Aucun serveur réel déclaré.
openapi: 3.1.0
info:
  title: KAIVIRO Admin API
  version: 0.2.0
  summary: API privée du Command Center (accès VPN uniquement).
  description: 'Façade unique du Command Center. Le navigateur ne parle qu''à cette API.

    Réponses de lecture : enveloppe plate conforme à freshness.schema.json (source, source_label, fetched_at, freshness, demo, unknown_reason) plus `data`.

    Écritures de niveau 2 et 3 : motif obligatoire (champ reason ou en-tête X-Kaiviro-Reason), journalisé au format audit-event.

    Autorisations vérifiées côté serveur : voir docs/security/ADMIN_PERMISSIONS.md.

    Rôle minimal indiqué par l''extension x-kaiviro-min-role, niveau d''action par x-kaiviro-level.

    Prototype CC-M1 : servi par les routes Next.js /api/admin/v1 du Command Center (ADMIN_ARCHITECTURE §7, option C), sur 127.0.0.1, sans authentification avant CC-M3.

    '
  license:
    name: À définir (ADR-0001, dépôt privé)
    identifier: LicenseRef-KAIVIRO-Private
servers:
- url: https://admin.kaiviro.invalid/admin/v1
  description: Placeholder. Aucun domaine réservé (ADR-0013). Accès VPN uniquement (ADR-0012).
security:
- adminSession: []
tags:
- name: sources
- name: overview
- name: crm
- name: infra
- name: backups
- name: incidents
- name: audit
- name: development
paths:
  /sources:
    get:
      tags:
      - sources
      operationId: listSources
      summary: État des sources S1 à S9
      x-kaiviro-min-role: viewer
      x-kaiviro-level: 1
      responses:
        '200':
          description: Registre des sources.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - connected
                - total
                properties:
                  connected:
                    type: integer
                    minimum: 0
                  total:
                    type: integer
                    minimum: 0
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Source'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /overview:
    get:
      tags:
      - overview
      operationId: getOverview
      summary: Vue de synthèse (Executive Overview)
      x-kaiviro-min-role: viewer
      x-kaiviro-level: 1
      responses:
        '200':
          description: Santé agrégée, dernière sauvegarde, dernier déploiement, incidents ouverts.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../schemas/ops/freshness.schema.json
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - type: object
                        properties:
                          services:
                            type: array
                            items:
                              $ref: ../../schemas/ops/service-health.schema.json
                          last_backup:
                            oneOf:
                            - $ref: ../../schemas/ops/backup-run.schema.json
                            - type: 'null'
                          last_deployment:
                            oneOf:
                            - $ref: ../../schemas/ops/deployment.schema.json
                            - type: 'null'
                          open_incidents:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                        required:
                        - services
                      - type: 'null'
                      description: null si la donnée est inconnue (voir unknown_reason).
        '401':
          $ref: '#/components/responses/Unauthorized'
  /deliverables:
    get:
      tags:
      - crm
      operationId: listDeliverables
      summary: Livrables (issues GitHub) par mission
      x-kaiviro-min-role: viewer
      x-kaiviro-level: 1
      parameters:
      - name: mission
        in: query
        schema:
          type: string
          enum:
          - commun
          - a
          - b
          - humains
      responses:
        '200':
          description: Liste paginée.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../schemas/ops/freshness.schema.json
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - type: array
                        items:
                          $ref: '#/components/schemas/Deliverable'
                      - type: 'null'
                      description: null si la donnée est inconnue (voir unknown_reason).
                    next_cursor:
                      type:
                      - string
                      - 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - crm
      operationId: createDeliverable
      summary: Créer un livrable (issue « livrable », statut todo)
      x-kaiviro-min-role: developer
      x-kaiviro-level: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - mission
              - type
              - days
              - reason
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 120
                mission:
                  type: string
                  enum:
                  - commun
                  - a
                  - b
                type:
                  type: string
                  minLength: 2
                  maxLength: 24
                days: &id001
                  type: array
                  items:
                    type: integer
                    minimum: 1
                    maximum: 10
                  minItems: 2
                  maxItems: 2
                path:
                  type: string
                  maxLength: 160
                reason: &id002
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: 'Motif journalisé (ADMIN_PERMISSIONS). Alternative : en-tête X-Kaiviro-Reason.'
      responses:
        '201':
          description: Créé.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../schemas/ops/freshness.schema.json
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - $ref: '#/components/schemas/Deliverable'
                      - type: 'null'
                      description: null si la donnée est inconnue (voir unknown_reason).
        '400': &id003
          $ref: '#/components/responses/ValidationError'
        '403': &id004
          $ref: '#/components/responses/Forbidden'
  /deliverables/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - crm
      operationId: getDeliverable
      summary: 'Fiche d''un livrable : notes et commentaires GitHub'
      x-kaiviro-min-role: viewer
      x-kaiviro-level: 1
      responses:
        '200':
          description: Fiche.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../schemas/ops/freshness.schema.json
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - type: object
                        required:
                        - deliverable
                        - notes
                        - comments
                        - commentsKnown
                        properties:
                          deliverable:
                            $ref: '#/components/schemas/Deliverable'
                          notes:
                            type: string
                          comments:
                            type: array
                            items:
                              type: object
                              required:
                              - id
                              - author
                              - body
                              - at
                              - url
                              properties:
                                id:
                                  type: integer
                                author:
                                  type: string
                                body:
                                  type: string
                                at:
                                  type: string
                                  format: date-time
                                url:
                                  type: string
                                  format: uri
                          commentsKnown:
                            type: boolean
                      - type: 'null'
                      description: null si la donnée est inconnue (voir unknown_reason).
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - crm
      operationId: updateDeliverable
      summary: Modifier un livrable (statut, titre, mission, type, jours, chemin) dans GitHub
      x-kaiviro-min-role: developer
      x-kaiviro-level: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              minProperties: 2
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum:
                  - todo
                  - in_progress
                  - in_review
                  - done
                title:
                  type: string
                  minLength: 3
                  maxLength: 120
                mission:
                  type: string
                  enum:
                  - commun
                  - a
                  - b
                type:
                  type: string
                  minLength: 2
                  maxLength: 24
                days: *id001
                path:
                  type: string
                  maxLength: 160
                  description: 'Chaîne vide : retire le chemin.'
                reason: *id002
      responses:
        '200':
          description: Mis à jour.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../schemas/ops/freshness.schema.json
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - $ref: '#/components/schemas/Deliverable'
                      - type: 'null'
                      description: null si la donnée est inconnue (voir unknown_reason).
        '400': *id003
        '403': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: GitHub a refusé la mise à jour.
  /decisions:
    get:
      tags:
      - crm
      operationId: listDecisions
      summary: Décisions ouvertes et tranchées
      x-kaiviro-min-role: viewer
      x-kaiviro-level: 1
      responses:
        '200':
          description: Liste.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../schemas/ops/freshness.schema.json
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - type: array
                        items:
                          $ref: '#/components/schemas/Decision'
                      - type: 'null'
                      description: null si la donnée est inconnue (voir unknown_reason).
        '401':
          $ref: '#/components/responses/Unauthorized'
  /partners:
    get:
      tags:
      - crm
      operationId: listPartners
      x-kaiviro-min-role: administrator
      x-kaiviro-level: 1
      responses:
        '200':
          description: Liste des partenaires.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../schemas/ops/freshness.schema.json
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - type: array
                        items:
                          $ref: '#/components/schemas/Partner'
                      - type: 'null'
                      description: null si la donnée est inconnue (voir unknown_reason).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - crm
      operationId: createPartner
      x-kaiviro-min-role: administrator
      x-kaiviro-level: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerInput'
      responses:
        '201':
          description: Créé.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../schemas/ops/freshness.schema.json
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - $ref: '#/components/schemas/Partner'
                      - type: 'null'
                      description: null si la donnée est inconnue (voir unknown_reason).
        '400': *id003
        '403': *id004
  /partners/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - crm
      operationId: getPartner
      x-kaiviro-min-role: administrator
      x-kaiviro-level: 1
      responses:
        '200':
          description: Partenaire.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../schemas/ops/freshness.schema.json
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - $ref: '#/components/schemas/Partner'
                      - type: 'null'
                      description: null si la donnée est inconnue (voir unknown_reason).
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - crm
      operationId: updatePartner
      x-kaiviro-min-role: administrator
      x-kaiviro-level: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerPatch'
      responses:
        '200':
          description: Mis à jour.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../schemas/ops/freshness.schema.json
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - $ref: '#/components/schemas/Partner'
                      - type: 'null'
                      description: null si la donnée est inconnue (voir unknown_reason).
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - crm
      operationId: deletePartner
      summary: Suppression (niveau 3, confirmation renforcée, journalisée)
      x-kaiviro-min-role: owner
      x-kaiviro-level: 3
      parameters: []
      responses:
        '204':
          description: Supprimé.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Confirmation absente ou incorrecte.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - confirm
              - reason
              additionalProperties: false
              properties:
                confirm:
                  type: string
                  description: Référence du partenaire retapée, ex. G-01.
                reason: *id002
  /infra/pi:
    get:
      tags:
      - infra
      operationId: getPiStatus
      summary: CPU, RAM, température, disque, uptime, throttling de la Pi
      x-kaiviro-min-role: viewer
      x-kaiviro-level: 1
      responses:
        '200':
          description: Indicateurs. Valeurs null si la Pi n'est pas installée.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../schemas/ops/freshness.schema.json
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - type: object
                        properties:
                          metrics:
                            type: array
                            items:
                              $ref: ../../schemas/ops/metric.schema.json
                        required:
                        - metrics
                      - type: 'null'
                      description: null si la donnée est inconnue (voir unknown_reason).
  /infra/containers:
    get:
      tags:
      - infra
      operationId: listContainers
      x-kaiviro-min-role: viewer
      x-kaiviro-level: 1
      responses:
        '200':
          description: Conteneurs connus de l'inventaire Compose et leur état.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../schemas/ops/freshness.schema.json
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - type: array
                        items:
                          $ref: '#/components/schemas/Container'
                      - type: 'null'
                      description: null si la donnée est inconnue (voir unknown_reason).
  /infra/containers/{name}/restart:
    post:
      tags:
      - infra
      operationId: restartContainer
      summary: Redémarrer un conteneur de la liste blanche
      x-kaiviro-min-role: administrator
      x-kaiviro-level: 2
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          enum:
          - uptime-kuma
          - prometheus
          - node-exporter
          - grafana
          - cadvisor
          - loki
      - $ref: '#/components/parameters/Confirmation'
      - $ref: '#/components/parameters/Reason'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Action acceptée.
          content:
            application/json:
              schema:
                type: object
                required:
                - action_id
                - status
                properties:
                  action_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                    - queued
                    - running
                    - succeeded
                    - failed
        '403':
          $ref: '#/components/responses/Forbidden'
  /backups:
    get:
      tags:
      - backups
      operationId: listBackupRuns
      x-kaiviro-min-role: viewer
      x-kaiviro-level: 1
      responses:
        '200':
          description: Dernières exécutions de sauvegarde et de test de restauration.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../schemas/ops/freshness.schema.json
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - type: array
                        items:
                          $ref: ../../schemas/ops/backup-run.schema.json
                      - type: 'null'
                      description: null si la donnée est inconnue (voir unknown_reason).
  /incidents:
    get:
      tags:
      - incidents
      operationId: listIncidents
      x-kaiviro-min-role: viewer
      x-kaiviro-level: 1
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - open
          - closed
          - all
          default: open
      responses:
        '200':
          description: Liste.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../../schemas/ops/incident.schema.json
    post:
      tags:
      - incidents
      operationId: declareIncident
      x-kaiviro-min-role: administrator
      x-kaiviro-level: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - severity
              - service
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 160
                severity:
                  type: string
                  enum:
                  - SEV1
                  - SEV2
                  - SEV3
                  - SEV4
                service:
                  type: string
                summary:
                  type: string
                  maxLength: 4000
      responses:
        '201':
          description: Incident créé.
          content:
            application/json:
              schema:
                $ref: ../../schemas/ops/incident.schema.json
        '403':
          $ref: '#/components/responses/Forbidden'
  /incidents/{id}:
    patch:
      tags:
      - incidents
      operationId: updateIncident
      x-kaiviro-min-role: administrator
      x-kaiviro-level: 2
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum:
                  - acknowledged
                  - mitigating
                  - resolved
                  - closed
                note:
                  type: string
                  maxLength: 2000
                postmortem_url:
                  type: string
      responses:
        '200':
          description: Mis à jour.
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /audit:
    get:
      tags:
      - audit
      operationId: listAuditEvents
      x-kaiviro-min-role: owner
      x-kaiviro-level: 1
      parameters:
      - name: since
        in: query
        schema:
          type: string
          format: date-time
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Journal d'audit, ordre antéchronologique.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../../schemas/ops/audit-event.schema.json
                  next_cursor:
                    type:
                    - string
                    - 'null'
        '403':
          $ref: '#/components/responses/Forbidden'
  /dev/pull-requests:
    get:
      tags:
      - development
      operationId: listPullRequests
      x-kaiviro-min-role: viewer
      x-kaiviro-level: 1
      responses:
        '200':
          description: PR ouvertes, état de CI (S1).
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../schemas/ops/freshness.schema.json
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - type: array
                        items:
                          $ref: '#/components/schemas/PullRequest'
                      - type: 'null'
                      description: null si la donnée est inconnue (voir unknown_reason).
  /deliverables/{id}/comments:
    post:
      tags:
      - crm
      operationId: commentDeliverable
      summary: Commenter un livrable (commentaire GitHub)
      x-kaiviro-min-role: developer
      x-kaiviro-level: 2
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - body
              - reason
              additionalProperties: false
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 4000
                reason: *id002
      responses:
        '201':
          description: Commentaire créé.
        '400': *id003
        '403': *id004
  /decisions/{id}:
    post:
      tags:
      - crm
      operationId: actOnDecision
      summary: Commenter, trancher (commentaire + fermeture) ou rouvrir une décision
      description: 'Action d''audit : decision.comment, decision.resolve ou decision.reopen. L''ADR liée reste mise à jour par PR.'
      x-kaiviro-min-role: developer
      x-kaiviro-level: 2
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              - reason
              additionalProperties: false
              properties:
                action:
                  type: string
                  enum:
                  - comment
                  - resolve
                  - reopen
                option:
                  type: string
                  maxLength: 200
                note:
                  type: string
                  maxLength: 2000
                  description: Obligatoire pour comment.
                reason: *id002
      responses:
        '200':
          description: Action appliquée.
        '400': *id003
        '403': *id004
        '404':
          $ref: '#/components/responses/NotFound'
  /partners/{id}/events:
    post:
      tags:
      - crm
      operationId: addPartnerEvent
      summary: Ajouter une interaction à l'historique
      x-kaiviro-min-role: administrator
      x-kaiviro-level: 2
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kind
              - text
              - reason
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum:
                  - appel
                  - email
                  - rdv
                  - note
                text:
                  type: string
                  minLength: 1
                  maxLength: 1000
                date:
                  type: string
                  format: date
                reason: *id002
      responses:
        '201':
          description: Créé.
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../../schemas/ops/freshness.schema.json
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      oneOf:
                      - $ref: '#/components/schemas/Partner'
                      - type: 'null'
                      description: null si la donnée est inconnue (voir unknown_reason).
        '400': *id003
        '403': *id004
  /partners/import:
    post:
      tags:
      - crm
      operationId: importPartners
      summary: Remplacer toutes les fiches par un fichier exporté (état actuel sauvegardé avant)
      x-kaiviro-min-role: owner
      x-kaiviro-level: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - confirm
              - reason
              - file
              additionalProperties: false
              properties:
                confirm:
                  type: string
                  const: RESTAURER
                reason: *id002
                file:
                  description: Fichier exporté (format de stockage local).
      responses:
        '200':
          description: Importé.
        '400': *id003
        '403': *id004
        '409':
          description: Confirmation absente.
  /partners/backups:
    get:
      tags:
      - crm
      operationId: listPartnerBackups
      summary: Instantanés automatiques des partenaires
      x-kaiviro-min-role: administrator
      x-kaiviro-level: 1
      responses:
        '200':
          description: Liste.
    post:
      tags:
      - crm
      operationId: restorePartnerBackup
      summary: Restaurer un instantané (état actuel sauvegardé avant)
      x-kaiviro-min-role: owner
      x-kaiviro-level: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - confirm
              - reason
              - name
              additionalProperties: false
              properties:
                confirm:
                  type: string
                  const: RESTAURER
                reason: *id002
                name:
                  type: string
      responses:
        '200':
          description: Restauré.
        '400': *id003
        '403': *id004
        '409':
          description: Confirmation absente.
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: kaiviro_admin_session
      description: Cookie de session HttpOnly, Secure, SameSite=Strict, émis après MFA. Mécanisme final à trancher (ADR-0012).
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    Confirmation:
      name: X-Kaiviro-Confirm
      in: header
      required: true
      description: Jeton de confirmation à usage unique obtenu après re-saisie MFA (niveau 3) ou confirmation explicite (niveau 2).
      schema:
        type: string
        maxLength: 128
    Reason:
      name: X-Kaiviro-Reason
      in: header
      required: true
      description: Motif de l'action, journalisé.
      schema:
        type: string
        minLength: 3
        maxLength: 500
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Session absente ou expirée.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Rôle, périmètre ou confirmation insuffisants. Refus journalisé.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ressource inconnue.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Entrée invalide.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      description: RFC 9457. Aucun détail interne ni secret.
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlation_id:
          type: string
    Source:
      type: object
      required:
      - id
      - name
      - state
      - provenance
      properties:
        id:
          type: string
          enum:
          - S1
          - S2
          - S3
          - S4
          - S5
          - S6
          - S7
          - S8
          - S9
        name:
          type: string
        state:
          type: string
          enum:
          - connected
          - disconnected
          - error
          - planned
        phase:
          type: string
          description: Phase de branchement prévue, ex. CC-M2.
        provenance:
          $ref: ../../schemas/ops/freshness.schema.json
    Deliverable:
      type: object
      required:
      - id
      - title
      - mission
      - type
      - status
      - path
      - due_on
      - assignee
      - url
      - days
      properties:
        id:
          type: string
          description: gh-<numéro d'issue>, ou identifiant du plan de référence.
        title:
          type: string
        mission:
          type: string
          enum:
          - commun
          - a
          - b
          - humains
        type:
          type: string
          description: Label type:* de l'issue, ex. ADR, Spécification.
        status:
          type: string
          enum:
          - todo
          - in_progress
          - in_review
          - done
        path:
          type:
          - string
          - 'null'
          description: Chemin dans le dépôt.
        due_on:
          type:
          - string
          - 'null'
          format: date
        assignee:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
          format: uri
        days:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 10
          minItems: 2
          maxItems: 2
          description: Jours du plan [début, fin], ex. [5, 6] = J5–J6.
    Decision:
      type: object
      required:
      - id
      - title
      - status
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
          - open
          - decided
        adr:
          type:
          - string
          - 'null'
          description: Ex. ADR-0012.
        owner:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
          format: uri
    PartnerInput:
      type: object
      required:
      - type
      - name
      - reason
      additionalProperties: false
      properties:
        type: &id005
          type: string
          enum:
          - garage
          - obd_supplier
          - beta_tester
          description: Fixe la référence (G-, O-, T-) ; non modifiable.
        name: &id006
          type: string
          minLength: 2
          maxLength: 120
        role: &id007
          type: string
          maxLength: 80
        contact: &id008
          type: string
          maxLength: 160
          description: Contact professionnel uniquement.
        stage: &id009
          type: string
          enum:
          - to_contact
          - in_discussion
          - active
          - paused
          - closed
          description: closed ouvre le délai de conservation (CRM_SPEC §5.8).
        next_action: &id010
          type: string
          maxLength: 200
        due_on: &id011
          type:
          - string
          - 'null'
          format: date
          description: Date de relance.
        owner_name: &id012
          type: string
          enum:
          - Johan
          - Collègue
          description: Responsable. Remplacé par owner_admin_id avec les comptes admin (CC-M3).
        equipment: &id013
          type: string
          maxLength: 120
        consent_status: &id014
          type: string
          enum:
          - not_required
          - pending
          - granted
          - withdrawn
        notes: &id015
          type: string
          maxLength: 2000
          description: Professionnel uniquement. Aucune donnée sensible.
        reason: *id002
    Partner:
      type: object
      required:
      - id
      - ref
      - type
      - name
      - role
      - contact
      - stage
      - next_action
      - due_on
      - owner_name
      - owner_admin_id
      - equipment
      - consent_status
      - notes
      - created_at
      - updated_at
      - events
      properties:
        id:
          type: string
        ref:
          type: string
          pattern: ^[GOT]-\d{2,}$
        type: *id005
        name: *id006
        role: *id007
        contact: *id008
        stage: *id009
        next_action: *id010
        due_on: *id011
        owner_name: *id012
        equipment: *id013
        consent_status: *id014
        notes: *id015
        owner_admin_id:
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        events:
          type: array
          items:
            type: object
            required:
            - id
            - at
            - kind
            - text
            properties:
              id:
                type: string
              at:
                type: string
                format: date-time
              kind:
                type: string
                enum:
                - created
                - stage
                - due
                - edit
                - appel
                - email
                - rdv
                - note
              text:
                type: string
                maxLength: 1000
    Container:
      type: object
      required:
      - name
      - state
      properties:
        name:
          type: string
        image:
          type:
          - string
          - 'null'
        state:
          type: string
          enum:
          - running
          - restarting
          - exited
          - unknown
        restartable:
          type: boolean
          description: true si présent dans la liste blanche.
        cpu_ratio:
          type:
          - number
          - 'null'
        memory_bytes:
          type:
          - integer
          - 'null'
    PullRequest:
      type: object
      required:
      - number
      - title
      - branch
      - ci_status
      properties:
        number:
          type: integer
        title:
          type: string
        branch:
          type: string
        draft:
          type: boolean
        ci_status:
          type: string
          enum:
          - success
          - failure
          - pending
          - unknown
        url:
          type: string
          format: uri
    PartnerPatch:
      type: object
      required:
      - reason
      minProperties: 2
      additionalProperties: false
      properties:
        name: *id006
        role: *id007
        contact: *id008
        stage: *id009
        next_action: *id010
        due_on: *id011
        owner_name: *id012
        equipment: *id013
        consent_status: *id014
        notes: *id015
        reason: *id002
